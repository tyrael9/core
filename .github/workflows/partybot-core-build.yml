name: PartyBot Core build

on:
  pull_request:
    branches:
      - validation/partybot-engine-base-0e3ff01
  push:
    branches:
      - work/partybot-engine-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partybot-core-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    name: Linux ARM64 / Vanilla 5875
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            ccache \
            libmariadb-dev \
            libssl-dev \
            zlib1g-dev

      - name: Run pure PartyBotEngine tests
        run: bash src/game/PlayerBots/Engine/tests/run_tests.sh

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ccache-${{ github.ref }}-
            ${{ runner.os }}-${{ runner.arch }}-ccache-

      - name: Configure
        run: |
          ccache --zero-stats
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=14 \
            -DBUILD_FOR_HOST_CPU=OFF \
            -DBUILD_WARNINGS_AS_ERROR=OFF \
            -DUSE_PCH=OFF \
            -DENABLE_CPPTRACE=OFF \
            -DUSE_SCRIPTS=ON \
            -DBUILD_EXTRACTORS=OFF \
            -DBUILD_REALMMERGE=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build server and realm daemon
        run: cmake --build build --parallel 2

      - name: Validate simulator runtime harness syntax
        run: bash -n tools/partybot-simulator/run-ci.sh

      # Report only whether fixture secrets were injected; never print their values.
      - name: Check simulator fixture secret availability
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          PARTYBOT_SIMULATOR_DATA_URL: ${{ secrets.PARTYBOT_SIMULATOR_DATA_URL }}
          PARTYBOT_SIMULATOR_DATA_SHA256: ${{ secrets.PARTYBOT_SIMULATOR_DATA_SHA256 }}
        run: |
          if [[ -n "$PARTYBOT_SIMULATOR_DATA_URL" ]]; then
            echo "[PartyBotSimulator] Fixture URL secret: present"
          else
            echo "[PartyBotSimulator] Fixture URL secret: MISSING"
          fi
          if [[ -n "$PARTYBOT_SIMULATOR_DATA_SHA256" ]]; then
            echo "[PartyBotSimulator] SHA256 secret: present"
          else
            echo "[PartyBotSimulator] SHA256 secret: MISSING"
          fi

      # Runtime uses only disposable schemas and an extracted-data fixture shared
      # through Google Drive. It is push-only and remains a no-op until both secrets exist.
      - name: Run optional Core-backed simulator runtime test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          PARTYBOT_SIMULATOR_DATA_URL: ${{ secrets.PARTYBOT_SIMULATOR_DATA_URL }}
          PARTYBOT_SIMULATOR_DATA_SHA256: ${{ secrets.PARTYBOT_SIMULATOR_DATA_SHA256 }}
        run: bash tools/partybot-simulator/run-ci.sh

      - name: Upload simulator runtime logs
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: partybot-simulator-${{ github.sha }}
          path: |
            simulator.log
            simulator-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats
