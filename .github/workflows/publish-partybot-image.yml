name: Publish PartyBot ARM64 container

on:
  push:
    branches:
      - work/partybot-engine-foundation
    paths:
      - .github/workflows/publish-partybot-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: partybot-image-publish
  cancel-in-progress: false

env:
  CORE_REPOSITORY: tyrael9/core
  CORE_REVISION: ${{ github.sha }}
  DEPLOY_REPOSITORY: tyrael9/vmangos-deploy
  DEPLOY_REVISION: ebaa560951459419c35140e20d787ec5db2905b8
  IMAGE_NAME: ghcr.io/tyrael9/vmangos-server
  IMAGE_TAG: partybot-shadow-${{ github.sha }}

jobs:
  build-and-publish:
    name: Build and publish linux/arm64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out PartyBot Core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REVISION }}
          path: core
          persist-credentials: false

      - name: Run standalone PartyBot engine tests
        working-directory: core
        run: bash src/game/PlayerBots/Engine/tests/run_tests.sh

      - name: Check out pinned deployment wrapper
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPOSITORY }}
          ref: ${{ env.DEPLOY_REVISION }}
          path: deploy
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 server image
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/docker/server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            VMANGOS_REPOSITORY_URL=https://github.com/${{ env.CORE_REPOSITORY }}.git
            VMANGOS_REVISION=${{ env.CORE_REVISION }}
            VMANGOS_CLIENT_VERSION=5875
            VMANGOS_FAIL_ON_PATCH_ERROR=0
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.CORE_REPOSITORY }}
            org.opencontainers.image.revision=${{ env.CORE_REVISION }}
            org.opencontainers.image.description=vMaNGOS Vanilla 5875 PartyBot Shadow runtime diagnostics test image
